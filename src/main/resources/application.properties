spring.application.name=learning-backend

# Database Connection（値は環境変数から注入。ソースコードには秘密情報を書かない）
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.udemy.hello.model

# GitHub OAuth（値は環境変数から注入）
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}

# ログイン後の本人確認トークン(JWT)の署名鍵（値は環境変数から注入。十分に長いランダム文字列を設定すること）
jwt.secret=${JWT_SECRET}

# CORSで許可するフロントエンドのオリジン（Static Site化でURLが変わったら環境変数だけ更新すればよい）
frontend.origin=${FRONTEND_ORIGIN:https://learning-frontend-x5jf.onrender.com}

# Server Port
server.port=${PORT:8080}
